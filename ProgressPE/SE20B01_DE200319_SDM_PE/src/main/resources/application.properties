spring.application.name=SE20B01_DE200319_SDM_PE

server.port=8080
server.servlet.context-path=/

# MS SQL Server connection (SQL Server / Windows Authentication mode, sa/sa as required by the exam Q5.4)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HSF302_2026_PE_SDM;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Table/column names are managed manually via sql/create_tables.sql, so ddl-auto must stay "none"
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
